# 推送 v* 标签时：构建（arm64 + x86_64 通用）、打包 .app 与 CLI、发布到 GitHub Releases。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 构建（通用架构）
        run: swift build -c release --arch arm64 --arch x86_64

      - name: 打包 GUI .app
        run: |
          set -euo pipefail
          mkdir -p dist
          APP="dist/MugUninstaller.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/apple/Products/Release/mug-uninstaller "$APP/Contents/MacOS/mug-uninstaller"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleName</key><string>MugUninstaller</string>
          	<key>CFBundleDisplayName</key><string>Mug Uninstaller</string>
          	<key>CFBundleIdentifier</key><string>com.emonyr.mug-uninstaller</string>
          	<key>CFBundleExecutable</key><string>mug-uninstaller</string>
          	<key>CFBundlePackageType</key><string>APPL</string>
          	<key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
          	<key>CFBundleVersion</key><string>1</string>
          	<key>CFBundleIconFile</key><string>AppIcon</string>
          	<key>LSMinimumSystemVersion</key><string>13.0</string>
          	<key>NSHighResolutionCapable</key><true/>
          	<key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          EOF
          codesign --force -s - "$APP"
          ditto -c -k --keepParent "$APP" "dist/MugUninstaller-${{ github.ref_name }}-macOS.zip"
          cp .build/apple/Products/Release/mug-uninstaller-cli dist/mug-uninstaller-cli
          shasum -a 256 "dist/MugUninstaller-${{ github.ref_name }}-macOS.zip" dist/mug-uninstaller-cli > dist/SHA256SUMS

      # 正式分发时启用：Developer ID 签名 + notarytool 公证（需配置 secrets：
      # APPLE_CERTIFICATE_BASE64 / APPLE_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID）

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MugUninstaller-*.zip
            dist/mug-uninstaller-cli
            dist/SHA256SUMS
